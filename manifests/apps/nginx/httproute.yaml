# Attaches the application to the shared Gateway.
#
# This is the deployer's half of the split: they can publish and withdraw their
# own route, but the Gateway it attaches to -- and its certificate -- belong to
# the cluster admin.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nginx
  namespace: nginx-demo
spec:
  parentRefs:
    # sectionName pins this to the HTTPS listener. Omitting it attaches the
    # route to *every* listener on the Gateway, including the plaintext one --
    # which silently serves the application over HTTP and takes precedence over
    # the redirect, so the site answers on port 80 instead of being upgraded.
    - name: demo-gateway
      sectionName: https
  hostnames:
    - nginx.demo.homelab.n2solutions.io
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: nginx
          port: 80
