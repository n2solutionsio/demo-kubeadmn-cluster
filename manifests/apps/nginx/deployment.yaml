apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: nginx-demo
  labels:
    app: nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      # Hardened enough to pass a restricted Pod Security Standard. nginx
      # unprivileged listens on 8080, which is what lets the container drop
      # root entirely -- the stock nginx image binds 80 and needs to start as
      # root to do it.
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.29-alpine
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: cache
              mountPath: /tmp
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 2
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 5
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits:   { memory: 128Mi }
      volumes:
        - name: content
          configMap:
            name: nginx-content
        # readOnlyRootFilesystem means nginx needs a writable path for its
        # temporary files.
        - name: cache
          emptyDir: {}
