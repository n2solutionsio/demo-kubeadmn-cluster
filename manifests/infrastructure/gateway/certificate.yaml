# cert-manager issues this from Let's Encrypt and writes the result into the
# secret named below. The Gateway then references that secret.
#
# Requesting the certificate explicitly, rather than annotating the Gateway and
# letting cert-manager infer it, is deliberate: the Certificate is a real object
# you can inspect, describe and show issuing during a demo. The annotation
# approach hides that behind a controller and needs cert-manager's Gateway API
# support switched on.
#
# The secret lands in this namespace alongside the application, which is exactly
# why the deployer Role withholds `secrets` -- otherwise a user who can deploy
# an app could read the private key for the site's certificate.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: demo-wildcard-tls
  namespace: nginx-demo
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  secretName: demo-wildcard-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  # A wildcard for this cluster's own DNS zone, so every application deployed
  # here is covered by one certificate rather than triggering a fresh issuance
  # per hostname. Let's Encrypt only issues wildcards via DNS-01, which is
  # already how this issuer is configured.
  #
  # A wildcard covers one label: *.demo.homelab.n2solutions.io matches
  # nginx.demo.… but not demo.homelab.… itself, so the apex is listed
  # separately.
  dnsNames:
    - "*.demo.homelab.n2solutions.io"
    - demo.homelab.n2solutions.io
