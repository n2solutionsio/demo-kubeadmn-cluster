# Shared entry point into the cluster, owned by the cluster admin.
#
# This is the split the RBAC model enforces: the admin owns the Gateway --
# listeners, TLS, the address it answers on -- while an application team
# attaches an HTTPRoute to it. A deployer can publish a route but cannot change
# the certificate, add a listener, or take over the address.
#
# allowedRoutes restricts attachment to this namespace. Widening it to other
# namespaces would let any team with route permissions publish on this hostname.
#
# Cilium creates a LoadBalancer Service for this Gateway and draws its address
# from the CiliumLoadBalancerIPPool, then announces it on the LAN via the L2
# announcement policy.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: demo-gateway
  namespace: nginx-demo
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  gatewayClassName: cilium
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      # Wildcard for this cluster's DNS zone. The Gateway terminates TLS for
      # every name under it; each application then claims its own specific
      # hostname in its HTTPRoute. Adding a second app needs no change here.
      hostname: "*.demo.homelab.n2solutions.io"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: demo-wildcard-tls
      # Restricting attachment to this namespace matters more with a wildcard
      # listener: were other namespaces permitted, any team able to create an
      # HTTPRoute could claim any hostname in the zone -- including one already
      # in use by another application.
      allowedRoutes:
        namespaces:
          from: Same
